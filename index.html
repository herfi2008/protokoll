const b = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function oeffnen(schluessel) {
  const klar = await crypto.subtle.decrypt({name:"AES-GCM", iv:b(D.iv)}, schluessel, b(D.daten));
  document.open(); document.write(new TextDecoder().decode(klar)); document.close();
}
async function ausPasswort(pw) {
  const basis = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveKey"]);
  return crypto.subtle.deriveKey({name:"PBKDF2", hash:"SHA-256", salt:b(D.salz), iterations:D.iter},
    basis, {name:"AES-GCM", length:256}, true, ["decrypt"]);
}
(async () => {
  const gemerkt = localStorage.getItem("protokoll-schluessel");
  if (gemerkt) try {
    await oeffnen(await crypto.subtle.importKey("raw", b(gemerkt), "AES-GCM", true, ["decrypt"])); return;
  } catch (e) { localStorage.removeItem("protokoll-schluessel"); }
})();
document.getElementById("form").onsubmit = async ev => {
  ev.preventDefault();
  try {
    const k = await ausPasswort(document.getElementById("pw").value);
    const roh = new Uint8Array(await crypto.subtle.exportKey("raw", k));
    await crypto.subtle.decrypt({name:"AES-GCM", iv:b(D.iv)}, k, b(D.daten));
    if (document.getElementById("merk").checked)
      localStorage.setItem("protokoll-schluessel", btoa(String.fromCharCode(...roh)));
    await oeffnen(k);
  } catch (e) { document.getElementById("f").textContent = "Falsches Passwort."; }
};
